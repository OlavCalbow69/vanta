name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: VS 2026 x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate Visual Studio 2026 MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild) {
            throw 'Visual Studio 2026 MSBuild was not found.'
          }
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Build Debug x64
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH .\vanta.sln /m /t:Build `
            /p:Configuration=Debug /p:Platform=x64 /nologo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Release x64
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH .\vanta.sln /m /t:Build `
            /p:Configuration=Release /p:Platform=x64 /nologo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify and package runtime bundle
        shell: pwsh
        run: |
          $runtimeFiles = @(
            'build\Release\vanta.exe',
            'build\Release\opencv_world500.dll',
            'build\Release\makcu-cpp.dll'
          )
          foreach ($file in $runtimeFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected runtime file is missing: $file"
            }
          }

          $stage = 'artifacts\vanta-ci-win64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($file in $runtimeFiles) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Copy-Item -LiteralPath 'README.md' -Destination $stage
          Compress-Archive -Path "$stage\*" `
            -DestinationPath 'artifacts\vanta-ci-win64.zip' -Force

      - name: Upload temporary Release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vanta-${{ github.sha }}-win64
          path: artifacts/vanta-ci-win64.zip
          if-no-files-found: error
          retention-days: 3
